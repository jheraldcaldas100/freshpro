# Blueprint de Render: servicio web Docker en plan gratuito (hasta F5).
# La base de datos está en Neon; su cadena de conexión se carga en DATABASE_URL.
services:
  - type: web
    name: oppu
    runtime: docker
    plan: free
    healthCheckPath: /salud/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: HOJA_CSV_URL
        sync: false
